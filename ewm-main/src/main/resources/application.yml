server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_main
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

stats-server:
  url: ${STATS_SERVER_URL:http://localhost:9090}

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.web: INFO